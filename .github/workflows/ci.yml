name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
      - name: Verify workspace
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1
